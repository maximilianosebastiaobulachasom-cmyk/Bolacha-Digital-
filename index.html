<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolachas Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --cor: #d2691e; }
        body { font-family: sans-serif; background: #fffaf0; margin: 0; text-align: center; }
        header { background: var(--cor); color: white; padding: 20px; }
        .vitrine { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin: 10px; width: 200px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: var(--cor); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <header><h1>🍪 Bolachas Digital</h1></header>
    <div id="produtos" class="vitrine">Carregando delícias...</div>

    <script>
        // SUBSTITUA PELOS SEUS DADOS DO SUPABASE
        const SUPABASE_URL = 'SUA_URL_AQUI';
        const SUPABASE_KEY = 'sb_publishable_nhIfpiCjuFFKT9-2JJBipw_rUNEJDzq';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarProdutos() {
            const { data, error } = await supabase.from('produtos').select('*');
            const div = document.getElementById('produtos');
            if (data) {
                div.innerHTML = data.map(p => `
                    <div class="card">
                        <h3>${p.nome}</h3>
                        <p>R$ ${p.preco}</p>
                        <button onclick="comprar('${p.nome}')">Encomendar</button>
                    </div>
                `).join('');
            } else { div.innerHTML = "Adicione produtos no banco de dados!"; }
        }

        function comprar(nome) {
            const msg = encodeURIComponent(`Olá! Quero encomendar: ${nome}`);
            window.open(`https://wa.me/955843093?text=${msg}`);
        }
        carregarProdutos();
    </script>
</body>
</html>
